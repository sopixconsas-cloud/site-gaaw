<script>
(function(){
  // Sur github.io (site de projet), le site vit dans un sous-dossier : on le détecte pour que les liens marchent partout.
  var base = "/";
  if (/\.github\.io$/.test(location.hostname)) {
    var seg = location.pathname.split("/").filter(Boolean)[0];
    if (seg) base = "/" + seg + "/";
  }
  if (location.protocol === "file:") return;
  document.getElementById("go-home").href = base;
  document.getElementById("home-logo").href = base;
  document.getElementById("go-dl").href = base + "telecharger.html";
})();
